site_name: openfe-api
site_description: Run OpenFE free energy experiments on HPC and server VMs.
site_url: https://eneskelestemur.github.io/openfe-api/
repo_url: https://github.com/eneskelestemur/openfe-api
repo_name: eneskelestemur/openfe-api
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

nav:
  - Home: index.md
  - Start here:
      - Install: start/install.md
      - Your first campaign: start/quickstart.md
      - How a campaign works: start/campaign.md
  - Protocols:
      - Choosing a protocol: protocols/index.md
      - ABFE: protocols/abfe.md
      - RBFE: protocols/rbfe.md
      - SepTop: protocols/septop.md
      - Plain MD and relaxation: protocols/md.md
  - Running:
      - Input contract: running/inputs.md
      - Preparation and planning: running/prepare.md
      - Execution: running/execution.md
      - Service and container: running/service.md
  - Results:
      - Gathering results: results/gather.md
      - Analysis: results/analysis.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/api.md
      - Contributing: reference/contributing.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
